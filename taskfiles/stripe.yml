version: '3'

vars:
  # URLs - Stripe Dashboard
  STRIPE_URL_DASHBOARD: https://dashboard.stripe.com
  STRIPE_URL_API_KEYS: https://dashboard.stripe.com/test/apikeys
  STRIPE_URL_WEBHOOKS: https://dashboard.stripe.com/test/webhooks
  STRIPE_URL_PRODUCTS: https://dashboard.stripe.com/test/products
  STRIPE_URL_CLI_DOCS: https://stripe.com/docs/stripe-cli
  # URLs - Local endpoints (uses PB_PORT from .env or defaults to 8090)
  STRIPE_URL_LOCAL_WEBHOOK: 'http://localhost:${PB_PORT:-8090}/stripe'
  # Versions
  STRIPE_VERSION_CLI: v1.33.0
  # Secrets (loaded from .env via dotenv in main Taskfile)
  # STRIPE_SECRET_KEY - API secret key (sk_test_xxx or sk_live_xxx)
  # STRIPE_WHSEC - Webhook signing secret (whsec_xxx)

tasks:
  # === Debug ===
  debug:
    desc: Print all Stripe vars
    silent: true
    cmds:
      - |
        echo "STRIPE_URL_DASHBOARD:     {{.STRIPE_URL_DASHBOARD}}"
        echo "STRIPE_URL_API_KEYS:      {{.STRIPE_URL_API_KEYS}}"
        echo "STRIPE_URL_WEBHOOKS:      {{.STRIPE_URL_WEBHOOKS}}"
        echo "STRIPE_URL_PRODUCTS:      {{.STRIPE_URL_PRODUCTS}}"
        echo "STRIPE_URL_CLI_DOCS:      {{.STRIPE_URL_CLI_DOCS}}"
        echo "STRIPE_URL_LOCAL_WEBHOOK: {{.STRIPE_URL_LOCAL_WEBHOOK}}"
        echo "STRIPE_VERSION_CLI:       {{.STRIPE_VERSION_CLI}}"
        echo "STRIPE_SECRET_KEY:        ${STRIPE_SECRET_KEY:+[SET]}"
        echo "STRIPE_WHSEC:             ${STRIPE_WHSEC:+[SET]}"

  # === Stripe Setup (numbered for order) ===
  1-install:
    desc: Install Stripe CLI
    env:
      GOWORK: "off"
    status:
      - command -v stripe
    cmds:
      - go install github.com/stripe/stripe-cli/cmd/stripe@{{.STRIPE_VERSION_CLI}}

  2-login:
    desc: Login to Stripe CLI (opens browser)
    cmds:
      - stripe login

  2-login-interactive:
    desc: Login to Stripe CLI (manual pairing code)
    interactive: true
    cmds:
      - stripe login --interactive

  3-env:
    desc: Create .env file and add STRIPE_SECRET_KEY
    cmds:
      - |
        if [ -f .env ]; then
          echo ".env already exists"
        else
          cp .env.example .env
          echo "✓ Created .env from .env.example"
        fi
        echo ""
        echo "ACTION: Get your API key from {{.STRIPE_URL_API_KEYS}}"
        open "{{.STRIPE_URL_API_KEYS}}" 2>/dev/null || true
        echo "  1. Copy your Secret key (sk_test_...)"
        echo "  2. Edit .env and set STRIPE_SECRET_KEY"
        echo "  3. Run: task stripe:4-fixtures"

  4-fixtures:
    desc: Load test products into Stripe
    cmds:
      - echo "Loading test products (Hobby + Freelancer plans)..."
      - stripe fixtures stripe_bootstrap/stripe-fixtures.json
      - 'echo "✓ Done! View at {{.STRIPE_URL_PRODUCTS}}"'

  5-listen:
    desc: Forward webhooks to local server (shows webhook secret on start)
    cmds:
      - |
        echo "Starting webhook listener -> {{.STRIPE_URL_LOCAL_WEBHOOK}}"
        echo "Copy the whsec_xxx secret to .env as STRIPE_WHSEC"
      - stripe listen --forward-to {{.STRIPE_URL_LOCAL_WEBHOOK}}

  6-test:
    desc: Test webhook integration
    cmds:
      - echo "Triggering test event..."
      - stripe trigger product.created
      - 'echo "✓ Check your stripe:5-listen terminal for the event"'

  # === Webhook Modes ===
  listen:live:
    desc: Forward Stripe webhooks (live mode)
    cmds:
      - stripe listen --forward-to {{.STRIPE_URL_LOCAL_WEBHOOK}} --live

  webhook:prod:
    desc: Show production webhook setup instructions
    silent: true
    cmds:
      - |
        echo "Production Webhook Setup"
        echo "========================"
        echo "1. Go to: {{.STRIPE_URL_WEBHOOKS}}"
        echo "2. Add endpoint: https://YOUR_DOMAIN/stripe"
        echo "3. Select events: product.*, price.*, customer.*, customer.subscription.*, checkout.session.completed"
        echo "4. Copy signing secret to production .env as STRIPE_WHSEC"
        open "{{.STRIPE_URL_WEBHOOKS}}" 2>/dev/null || true

  # === Test Events ===
  test:price:
    desc: Trigger a test price.created event
    cmds:
      - stripe trigger price.created

  test:subscription:
    desc: Trigger a test subscription event
    cmds:
      - stripe trigger customer.subscription.created

  test:checkout:
    desc: Trigger checkout session completed
    cmds:
      - stripe trigger checkout.session.completed

  test:all:
    desc: Trigger multiple test events
    cmds:
      - stripe trigger product.created
      - sleep 1
      - stripe trigger price.created
      - sleep 1
      - stripe trigger customer.subscription.created

  clean:
    desc: Clean up Stripe CLI auth and local .env for fresh setup
    cmds:
      - stripe logout 2>/dev/null || true
      - rm -f .env
      - 'echo "✓ Cleaned. Run setup steps again starting with: task stripe:1-install"'

  # === Info ===
  info:
    desc: Show Stripe configuration status
    silent: true
    cmds:
      - |
        echo "Stripe Secrets:"
        [ -n "${STRIPE_SECRET_KEY}" ] && echo "  ✓ STRIPE_SECRET_KEY" || echo "  ✗ STRIPE_SECRET_KEY"
        [ -n "${STRIPE_WHSEC}" ] && echo "  ✓ STRIPE_WHSEC" || echo "  ✗ STRIPE_WHSEC"
        echo ""
        echo "Stripe URLs:"
        echo "  SUCCESS: ${STRIPE_SUCCESS_URL:-[NOT SET]}"
        echo "  CANCEL:  ${STRIPE_CANCEL_URL:-[NOT SET]}"
        echo "  BILLING: ${STRIPE_BILLING_RETURN_URL:-[NOT SET]}"

  # === Gitignore ===
  gitignore:
    desc: Output gitignore patterns for Stripe
    silent: true
    cmds:
      - |
        echo "# Stripe"
        echo ".env"
        echo ".env.local"
        echo ".env.*.local"
        echo "*.log"
        echo "stripe.out"
