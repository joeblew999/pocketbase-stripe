version: '3'

vars:
  # Versions
  PC_VERSION: v1.34.0
  # Log file (process-compose writes logs here)
  PC_LOG_FILE: /tmp/process-compose.log
  # Binary (cross-platform: adds .exe on Windows)
  PC_BINARY: process-compose{{exeExt}}

tasks:
  # === Debug ===
  debug:
    desc: Print all process-compose vars
    silent: true
    cmds:
      - |
        echo "PC_VERSION:  {{.PC_VERSION}}"
        echo "PC_LOG_FILE: {{.PC_LOG_FILE}}"
        echo "PC_BINARY:   {{.PC_BINARY}}"

  dep:
    desc: Install process-compose via go install
    env:
      GOWORK: "off"
    status:
      - '{{.PC_BINARY}} version'
    cmds:
      - go install github.com/F1bonacc1/process-compose/v2@{{.PC_VERSION}}

  up:
    desc: Start all services with process-compose
    env:
      GOWORK: "off"
    cmds:
      - '{{.PC_BINARY}} up -t=false -L {{.PC_LOG_FILE}}'

  up-detached:
    desc: Start process-compose in detached mode
    env:
      GOWORK: "off"
    cmds:
      - '{{.PC_BINARY}} up -D -t=false -L {{.PC_LOG_FILE}}'

  down:
    desc: Stop all process-compose services
    cmds:
      - '{{.PC_BINARY}} down'

  restart:
    desc: Restart all process-compose services (down + up)
    env:
      GOWORK: "off"
    cmds:
      - '{{.PC_BINARY}} down'
      - '{{.PC_BINARY}} up -t=false -L {{.PC_LOG_FILE}}'

  logs:
    desc: Tail the process-compose log file
    cmds:
      - tail -f {{.PC_LOG_FILE}}

  list:
    desc: List running processes
    cmds:
      - '{{.PC_BINARY}} process list'
