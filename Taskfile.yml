version: '3'

dotenv: ['.env']

## For https://github.com/mrwyndham/pocketbase-stripe/issues/9#issuecomment-3639945631

## joeblew999 fork: https://github.com/joeblew999/pocketbase-stripe

includes:
  stripe: taskfiles/stripe.yml
  pb: taskfiles/pb.yml
  pc: taskfiles/pc.yml
  docker: taskfiles/docker.yml

tasks:
  # === Main Menu ===
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # =============================================================================
  # AGGREGATION TASKS - These call into sub-taskfiles (stripe, pb, pc, docker)
  # =============================================================================

  # === Debug (aggregates pb:debug + stripe:debug) ===
  debug:
    desc: Print all vars from all taskfiles
    silent: true
    cmds:
      - echo "=== POCKETBASE ==="
      - task pb:debug
      - echo ""
      - echo "=== STRIPE ==="
      - task stripe:debug

  # === Info (aggregates pb:info + stripe:info) ===
  info:
    desc: Show current configuration status
    silent: true
    cmds:
      - echo "=== CONFIGURATION STATUS ==="
      - echo ""
      - task pb:info
      - echo ""
      - task stripe:info

  # === Gitignore (aggregates stripe:gitignore + pb:gitignore) ===
  gitignore:
    desc: Generate .gitignore from all taskfile patterns
    cmds:
      - |
        echo "# Generated by: task gitignore > .gitignore"
        echo ""
        echo "# IDE"
        echo ".idea/"
        echo "*.swp"
        echo "*.swo"
        echo "*~"
        echo ""
        echo "# OS"
        echo ".DS_Store"
        echo "Thumbs.db"
        echo ""
      - task stripe:gitignore
      - echo ""
      - task pb:gitignore
    silent: true

  gitignore:write:
    desc: Write .gitignore file
    cmds:
      - task gitignore > .gitignore
      - echo "✓ Generated .gitignore"
