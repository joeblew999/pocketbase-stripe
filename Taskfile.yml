version: '3'

dotenv: ['.env']

## For https://github.com/mrwyndham/pocketbase-stripe/issues/9#issuecomment-3639945631

## joeblew999 fork: https://github.com/joeblew999/pocketbase-stripe

vars:
  # Paths
  BINARY: bin/pocketbase-stripe
  # Server config (can be overridden via .env)
  PB_HOST: '{{.PB_HOST | default "0.0.0.0"}}'
  PB_PORT: '{{.PB_PORT | default "8090"}}'
  # Derived URLs
  PB_URL_LOCAL: 'http://localhost:{{.PB_PORT}}'
  PB_URL_LOCAL_ADMIN: 'http://localhost:{{.PB_PORT}}/_/'

includes:
  stripe: taskfiles/stripe.yml
  pb: taskfiles/pb.yml
  pc: taskfiles/pc.yml
  docker: taskfiles/docker.yml

tasks:
  # === Quick Reference ===
  urls:
    desc: Show all important URLs for setup
    cmds:
      - |
        echo ""
        echo "=== IMPORTANT URLS ==="
        echo ""
        echo "STRIPE:"
        echo "  Dashboard:     https://dashboard.stripe.com"
        echo "  API Keys:      https://dashboard.stripe.com/test/apikeys"
        echo "  Webhooks:      https://dashboard.stripe.com/test/webhooks"
        echo "  Products:      https://dashboard.stripe.com/test/products"
        echo ""
        echo "POCKETBASE:"
        echo "  Docs:          https://pocketbase.io/docs"
        echo "  Admin Panel:   {{.PB_URL_LOCAL_ADMIN}}"
        echo ""

  # === Main Menu ===
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Development ===
  dev:
    desc: Run in development mode
    cmds:
      - |
        echo ""
        echo "Starting PocketBase on {{.PB_URL_LOCAL}}"
        echo "Admin panel: {{.PB_URL_LOCAL_ADMIN}}"
        echo ""
      - go run main.go serve --http "{{.PB_HOST}}:{{.PB_PORT}}"

  deps:
    desc: Update Go dependencies
    cmds:
      - go mod tidy

  serve:
    desc: Serve the built binary
    cmds:
      - ./{{.BINARY}} serve --http "{{.PB_HOST}}:{{.PB_PORT}}"

  # === Build ===
  build:
    desc: Build the application for current platform
    cmds:
      - go build -o {{.BINARY}} main.go

  build:linux:
    desc: Build for Linux amd64 (deployment)
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -o {{.BINARY}}-linux-amd64 main.go

  build:darwin:
    desc: Build for macOS (arm64)
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - go build -o {{.BINARY}}-darwin-arm64 main.go

  build:windows:
    desc: Build for Windows amd64
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -o {{.BINARY}}-windows-amd64.exe main.go

  # === Source Reference ===
  src:clone:
    desc: Clone PocketBase source for reference (helps with future upgrades)
    cmds:
      - mkdir -p .src
      - git clone --depth 1 --branch v0.34.2 https://github.com/pocketbase/pocketbase.git .src/pocketbase
    status:
      - test -d .src/pocketbase

  src:update:
    desc: Update PocketBase source to specific version
    dir: .src/pocketbase
    cmds:
      - git fetch --tags
      - git checkout v0.34.2

  # === Gitignore ===
  gitignore:
    desc: Generate .gitignore from all taskfile patterns
    cmds:
      - |
        echo "# Generated by: task gitignore > .gitignore"
        echo ""
        echo "# Build artifacts"
        echo "bin/"
        echo ""
        echo "# IDE"
        echo ".idea/"
        echo "*.swp"
        echo "*.swo"
        echo "*~"
        echo ""
        echo "# OS"
        echo ".DS_Store"
        echo "Thumbs.db"
        echo ""
      - task stripe:gitignore
      - echo ""
      - task pb:gitignore
    silent: true

  gitignore:write:
    desc: Write .gitignore file
    cmds:
      - task gitignore > .gitignore
      - echo "✓ Generated .gitignore"

  # === Info ===
  info:
    desc: Show current configuration status
    cmds:
      - |
        echo ""
        echo "=== CONFIGURATION STATUS ==="
        echo ""
        echo "Binary: {{.BINARY}}"
        echo ""
        echo "Server:"
        echo "  PB_HOST: {{.PB_HOST}}"
        echo "  PB_PORT: {{.PB_PORT}}"
        echo "  URL: {{.PB_URL_LOCAL}}"
        echo "  Admin: {{.PB_URL_LOCAL_ADMIN}}"
        echo ""
        echo "Stripe Secrets:"
        if [ -n "${STRIPE_SECRET_KEY}" ]; then
          echo "  ✓ STRIPE_SECRET_KEY: [SET]"
        else
          echo "  ✗ STRIPE_SECRET_KEY: [NOT SET]"
        fi
        if [ -n "${STRIPE_WHSEC}" ]; then
          echo "  ✓ STRIPE_WHSEC: [SET]"
        else
          echo "  ✗ STRIPE_WHSEC: [NOT SET]"
        fi
        echo ""
        echo "Stripe URLs:"
        echo "  STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-[NOT SET]}"
        echo "  STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-[NOT SET]}"
        echo "  STRIPE_BILLING_RETURN_URL: ${STRIPE_BILLING_RETURN_URL:-[NOT SET]}"
        echo ""
    silent: true
